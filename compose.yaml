x-environment: &app_environment
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-lms}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_development_password}
  POSTGRES_DB: ${POSTGRES_DB:-lms_development}
  SMTP_ADDRESS: ${SMTP_ADDRESS:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  environment: *app_environment
  volumes:
    - .:/rails
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_development_password}
      POSTGRES_DB: ${POSTGRES_DB:-lms_development}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    command: sh -c "bin/rails db:prepare db:seed && bin/rails server -b 0.0.0.0 -P /tmp/lms-server.pid"
    environment:
      <<: *app_environment
      ADMIN_NAME: ${ADMIN_NAME:-Platform Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-in-development}
      APP_USER_NAME: ${APP_USER_NAME:-Organization Owner}
      APP_USER_EMAIL: ${APP_USER_EMAIL:-owner@example.com}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-change-me-in-development}
      DEFAULT_ORGANIZATION_NAME: ${DEFAULT_ORGANIZATION_NAME:-Example School}
      DEFAULT_ORGANIZATION_SLUG: ${DEFAULT_ORGANIZATION_SLUG:-example-school}
      DEFAULT_ORGANIZATION_LOCALE: ${DEFAULT_ORGANIZATION_LOCALE:-en}
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  jobs:
    <<: *app
    command: bin/jobs start
    depends_on:
      web:
        condition: service_healthy

  css:
    <<: *app
    command: bin/rails "tailwindcss:watch[always]"

  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
